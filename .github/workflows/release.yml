name: Release JV Studio Free

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm test
      - id: version
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then test "${GITHUB_REF_NAME}" = "v${APP_VERSION}"; fi

  build:
    needs: verify
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-14
            rust-target: aarch64-apple-darwin
            bundle-args: --target aarch64-apple-darwin --bundles app
            asset-name: macos-aarch64
          - label: Windows x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundle-args: --target x86_64-pc-windows-msvc --bundles nsis
            asset-name: windows-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - name: Bundle removal engine (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -fL --retry 3 "https://github.com/allenk/VeoWatermarkRemover/releases/download/v0.6.4-demo/GeminiWatermarkTool-macOS-Universal-Video.zip" -o removal-engine.zip
          echo "b97c3c3d27c6c7e4e672e16b772a4e21ae4a93d4d15fcd6a6129ec441def4d5e  removal-engine.zip" | shasum -a 256 -c -
          unzip -j removal-engine.zip GeminiWatermarkTool-Video -d bin
          chmod 755 bin/GeminiWatermarkTool-Video
      - name: Bundle removal engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/allenk/VeoWatermarkRemover/releases/download/v0.6.4-demo/GeminiWatermarkTool-Windows-x64-Video.zip" -OutFile removal-engine.zip
          $expected = "e6a0fd8e1c6cbe26da02dafd8a1df4645ac35a565acab58e3171995dde4ab955"
          if ((Get-FileHash removal-engine.zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "Removal engine checksum mismatch" }
          Expand-Archive removal-engine.zip -DestinationPath removal-engine
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item removal-engine/GeminiWatermarkTool-Video.exe bin/GeminiWatermarkTool-Video.exe
      - name: Build app
        run: npm run tauri -- build ${{ matrix.bundle-args }}
      - name: Create macOS release files
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/JV Studio.app"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/JV-Studio-Free-macos-aarch64.zip"
          hdiutil create -volname "JV Studio Free" -srcfolder "$APP" -ov -format UDZO "release-assets/JV-Studio-Free-macos-aarch64.dmg"
      - name: Create Windows release files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe release-assets/
          Compress-Archive -Path release-assets/*.exe -DestinationPath release-assets/JV-Studio-Free-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset-name }}
          path: release-assets/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.verify.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: JV Studio Free v${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
